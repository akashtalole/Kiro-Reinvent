name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate labs and build site
        run: python scripts/build_site.py
      - name: Scenario doc is in sync with scenarios.json
        run: python scripts/gen_scenarios_md.py --check
      - name: Validate JSON assets
        run: |
          find labs site -name '*.json' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 python -m json.tool > /dev/null
      - name: Compile Python lab code
        run: python -m compileall -q labs
      - name: Property-based tests (Hypothesis)
        run: |
          python -m pip install --quiet "hypothesis==6.170.17" "pytest>=8"
          python -m pytest tests -q -p no:cacheprovider
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
